<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <base href="/" />
        <title>JobBridge Super Admin Console — Full DB & Platform Management</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <script src="/admin-config.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    "Plus Jakarta Sans",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: #f8fafc;
                color: #0f172a;
                overflow: hidden;
            }
            code,
            pre,
            .font-mono {
                font-family:
                    "JetBrains Mono",
                    ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    monospace;
            }
            .spinner {
                width: 20px;
                height: 20px;
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-top-color: #fff;
                border-radius: 50%;
                animation: spin 0.6s linear infinite;
                display: inline-block;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .btn {
                padding: 7px 14px;
                border-radius: 8px;
                font-size: 12px;
                font-weight: 600;
                border: none;
                cursor: pointer;
                transition: all 0.15s ease;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                line-height: 1.25;
            }
            .btn:active {
                transform: scale(0.98);
            }
            .btn-primary {
                background: #2563eb;
                color: #fff;
                box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
            }
            .btn-primary:hover {
                background: #1d4ed8;
            }
            .btn-danger {
                background: #fef2f2;
                color: #dc2626;
                border: 1px solid #fecaca;
            }
            .btn-danger:hover {
                background: #fee2e2;
                border-color: #fca5a5;
            }
            .btn-success {
                background: #f0fdf4;
                color: #16a34a;
                border: 1px solid #bbf7d0;
            }
            .btn-success:hover {
                background: #dcfce7;
                border-color: #86efac;
            }
            .btn-ghost {
                background: #f1f5f9;
                color: #475569;
                border: 1px solid #e2e8f0;
            }
            .btn-ghost:hover {
                background: #e2e8f0;
                color: #1e293b;
            }
            .btn-warning {
                background: #fffbeb;
                color: #d97706;
                border: 1px solid #fde68a;
            }
            .btn-warning:hover {
                background: #fef3c7;
            }
            .btn-purple {
                background: #faf5ff;
                color: #9333ea;
                border: 1px solid #e9d5ff;
            }
            .btn-purple:hover {
                background: #f3e8ff;
            }
            input,
            select,
            textarea {
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                padding: 8px 12px;
                font-size: 13px;
                outline: none;
                width: 100%;
                background: #ffffff;
                transition: 0.15s;
                font-family: inherit;
            }
            input:focus,
            select:focus,
            textarea:focus {
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            }
            .badge {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 2px 8px;
                border-radius: 999px;
                font-size: 11px;
                font-weight: 600;
                line-height: 1.3;
            }
            .table-wrap {
                overflow-x: auto;
                border-radius: 12px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th {
                text-align: left;
                padding: 10px 14px;
                font-weight: 700;
                color: #64748b;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                background: #f8fafc;
                border-bottom: 1px solid #e2e8f0;
                white-space: nowrap;
            }
            td {
                padding: 11px 14px;
                border-bottom: 1px solid #f1f5f9;
                font-size: 13px;
                vertical-align: middle;
            }
            tr:hover td {
                background: #f8fafc;
            }
            .modal-overlay {
                position: fixed;
                inset: 0;
                z-index: 60;
                background: rgba(15, 23, 42, 0.6);
                backdrop-filter: blur(4px);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                animation: fadeIn 0.15s ease-out;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            .modal-card {
                background: #fff;
                border-radius: 18px;
                padding: 24px;
                max-width: 680px;
                width: 100%;
                max-height: 88vh;
                overflow-y: auto;
                box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.3);
                animation: slideUp 0.2s ease-out;
            }
            @keyframes slideUp {
                from {
                    transform: translateY(16px);
                    opacity: 0;
                }
                to {
                    transform: translateY(0);
                    opacity: 1;
                }
            }
            .modal-wide {
                max-width: 860px;
            }
            .modal-full {
                max-width: 1100px;
            }
            .modal-sm {
                max-width: 440px;
            }
            .toast {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 100;
                padding: 12px 20px;
                border-radius: 12px;
                color: #fff;
                font-size: 13px;
                font-weight: 600;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
                animation: slideIn 0.2s ease-out;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            @keyframes slideIn {
                from {
                    transform: translateX(40px);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            .stat-card {
                background: #fff;
                border-radius: 14px;
                border: 1px solid #e2e8f0;
                padding: 16px 18px;
                transition: all 0.2s;
            }
            .stat-card:hover {
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
                border-color: #cbd5e1;
            }
            .stat-num {
                font-size: 24px;
                font-weight: 800;
                line-height: 1.15;
                letter-spacing: -0.02em;
            }
            .stat-label {
                font-size: 11px;
                font-weight: 600;
                color: #64748b;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                margin-top: 4px;
            }
            .chart-bar {
                height: 8px;
                border-radius: 4px;
                background: #f1f5f9;
                overflow: hidden;
            }
            .chart-bar-fill {
                height: 100%;
                border-radius: 4px;
                transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            }
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }
            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
            .form-grid .full {
                grid-column: 1/-1;
            }
            .tab-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 18px;
                height: 18px;
                padding: 0 6px;
                border-radius: 999px;
                font-size: 10px;
                font-weight: 800;
                line-height: 1;
            }
            .sql-editor {
                font-family:
                    "JetBrains Mono",
                    ui-monospace,
                    monospace;
                background: #0f172a;
                color: #e2e8f0;
                border: 1px solid #1e293b;
                border-radius: 12px;
                padding: 14px 16px;
                font-size: 13px;
                line-height: 1.6;
                tab-size: 2;
                resize: vertical;
            }
            .sql-editor:focus {
                border-color: #3b82f6;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            }
            .snippet-chip {
                background: #f1f5f9;
                border: 1px solid #e2e8f0;
                padding: 4px 10px;
                border-radius: 6px;
                font-size: 11px;
                font-weight: 600;
                color: #334155;
                cursor: pointer;
                transition: 0.15s;
                white-space: nowrap;
            }
            .snippet-chip:hover {
                background: #e2e8f0;
                color: #0f172a;
                border-color: #cbd5e1;
            }
            .pulse-dot {
                animation: pulseDot 1.5s infinite;
            }
            @keyframes pulseDot {
                0%,
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.4;
                    transform: scale(0.85);
                }
            }
        </style>
    </head>
    <body>
        <div id="app" class="min-h-screen"></div>
        <script>
            // ═══════════════════════════════════════════════════════════════
            //  SUPER ADMIN CONFIG & AUTHENTICATION
            // ═══════════════════════════════════════════════════════════════
            let loginAttempts = parseInt(
                sessionStorage.getItem("jb_attempts") || "0",
            );
            let loginLockedUntil = parseInt(
                sessionStorage.getItem("jb_locked_until") || "0",
            );
            const MAX_ATTEMPTS = 5;
            const LOCKOUT_MINUTES = 15;
            let sessionTimer = null;
            const SESSION_TIMEOUT_MS = 60 * 60 * 1000; // 60 mins

            const SUPABASE_URL =
                window.__JOBBRIDGE_SUPABASE_URL__ ||
                "https://ppramomuckkjzssrfghi.supabase.co";
            const SUPABASE_ANON_KEY =
                window.__JOBBRIDGE_SUPABASE_ANON_KEY__ || "";
            const FUNCTIONS_BASE_URL = `${SUPABASE_URL}/functions/v1`;
            const ADMIN_CREATE_USER_FUNCTION = `${FUNCTIONS_BASE_URL}/admin-create-user`;

            function isSupabaseConfigured() {
                return Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
            }

            const sb = isSupabaseConfigured()
                ? window.supabase.createClient(
                      SUPABASE_URL,
                      SUPABASE_ANON_KEY,
                      {
                          auth: {
                              persistSession: true,
                              autoRefreshToken: true,
                              detectSessionInUrl: true,
                          },
                          realtime: {
                              params: {
                                  eventsPerSecond: 20,
                              },
                          },
                      },
                  )
                : null;

            function renderConfigError() {
                renderApp(`
          <div class="h-screen flex items-center justify-center p-4 bg-slate-900">
            <div class="bg-white rounded-2xl p-8 w-full max-w-lg shadow-2xl">
              <div class="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-600">
                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.29 3.86l-7.5 13A1 1 0 003.66 18h16.68a1 1 0 00.87-1.5l-7.5-13a1 1 0 00-1.74 0z"/></svg>
              </div>
              <h1 class="text-2xl font-bold text-gray-900 text-center mb-2">Admin Console Configuration Required</h1>
              <p class="text-sm text-gray-600 text-center mb-4">Provide the public Supabase anon key in <code>admin-config.js</code> to initialize the Super Admin Console.</p>
            </div>
          </div>
        `);
            }

            async function getAccessToken() {
                if (!sb) return "";
                const {
                    data: { session },
                } = await sb.auth.getSession();
                return session?.access_token || "";
            }

            async function resolveAdminUserFromSession() {
                if (!sb) return null;
                const {
                    data: { session },
                } = await sb.auth.getSession();
                if (!session?.user) return null;

                const userEmail = (session.user.email || "").toLowerCase();
                const isSuperAdminEmail =
                    userEmail === "superadmin@jobbridge.com.ng" ||
                    userEmail === "admin@jobbridge.com.ng";

                let { data: profile } = await sb
                    .from("profiles")
                    .select("id, email, full_name, role")
                    .eq("id", session.user.id)
                    .maybeSingle();

                if (!profile && isSuperAdminEmail) {
                    await sb.from("profiles").upsert({
                        id: session.user.id,
                        email: session.user.email,
                        full_name: "JobBridge Super Admin",
                        role: "admin",
                        is_active: true,
                        is_premium: true,
                    });
                    profile = {
                        id: session.user.id,
                        email: session.user.email,
                        full_name: "JobBridge Super Admin",
                        role: "admin",
                    };
                } else if (profile && isSuperAdminEmail && profile.role !== "admin") {
                    await sb
                        .from("profiles")
                        .update({ role: "admin" })
                        .eq("id", session.user.id);
                    profile.role = "admin";
                }

                if (!profile || (profile.role !== "admin" && !isSuperAdminEmail)) {
                    await sb.auth.signOut();
                    return null;
                }

                return {
                    id: profile.id,
                    email: profile.email || session.user.email || "",
                    full_name:
                        profile.full_name || session.user.email || "Super Admin",
                    role: "admin",
                };
            }

            async function callAdminCreateUser(payload) {
                const accessToken = await getAccessToken();
                if (!accessToken) throw new Error("Admin session expired");

                const res = await fetch(ADMIN_CREATE_USER_FUNCTION, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        apikey: SUPABASE_ANON_KEY,
                        Authorization: "Bearer " + accessToken,
                    },
                    body: JSON.stringify(payload),
                });

                const text = await res.text();
                const json = text ? JSON.parse(text) : {};
                if (!res.ok) {
                    throw new Error(json.error || `HTTP ${res.status}`);
                }
                return json;
            }

            // ═══════════════════════════════════════════════════════════════
            //  STATE MANAGEMENT
            // ═══════════════════════════════════════════════════════════════
            let S = {
                user: null,
                tab: "dashboard",
                users: [],
                jobs: [],
                apps: [],
                providers: [],
                convs: [],
                notifs: [],
                ads: [],
                payments: [],
                subs: [],
                events: [],
                reviews: [],
                alerts: [],
                // SQL Studio & DB Explorer State
                sqlQuery: "SELECT * FROM profiles LIMIT 25;",
                sqlResults: null,
                sqlError: null,
                sqlRunning: false,
                sqlHistory: JSON.parse(
                    localStorage.getItem("jb_sql_history") || "[]",
                ),
                activeTable: "profiles",
                tableRows: [],
                tableColumns: [],
                tableLoading: false,
                loading: true,
                realtimeConnected: false,
            };

            let modal = null;
            let refreshInterval = null;
            let refreshOn = true;
            let captchaAnswer = 0;
            let realtimeChannel = null;

            const $ = (s) => document.querySelector(s);
            const $$ = (s) => [...document.querySelectorAll(s)];
            const esc = (t) => {
                if (t == null) return "";
                const d = document.createElement("div");
                d.textContent = String(t);
                return d.innerHTML;
            };
            const fdate = (d) =>
                d
                    ? new Date(d).toLocaleDateString("en-GB", {
                          day: "numeric",
                          month: "short",
                          year: "numeric",
                      })
                    : "—";
            const fdatetime = (d) =>
                d
                    ? new Date(d).toLocaleString("en-GB", {
                          day: "numeric",
                          month: "short",
                          year: "numeric",
                          hour: "2-digit",
                          minute: "2-digit",
                      })
                    : "—";
            const money = (n) => "₦" + (n || 0).toLocaleString();

            function notify(msg, tp = "success") {
                const d = document.createElement("div");
                d.className =
                    "toast " +
                    (tp === "error"
                        ? "bg-red-600"
                        : tp === "warn"
                          ? "bg-amber-600"
                          : "bg-emerald-600");
                d.innerHTML = `<span>${esc(msg)}</span>`;
                document.body.appendChild(d);
                setTimeout(() => {
                    d.style.transition = "all .3s ease";
                    d.style.opacity = "0";
                    d.style.transform = "translateY(-10px)";
                    setTimeout(() => d.remove(), 300);
                }, 3000);
            }

            function renderApp(h) {
                $("#app").innerHTML = h;
            }

            function roleColor(r) {
                const m = {
                    admin: "bg-purple-100 text-purple-700 border border-purple-200",
                    recruiter:
                        "bg-blue-100 text-blue-700 border border-blue-200",
                    provider:
                        "bg-amber-100 text-amber-700 border border-amber-200",
                    job_seeker:
                        "bg-gray-100 text-gray-700 border border-gray-200",
                };
                return m[r] || "bg-gray-100 text-gray-600 border border-gray-200";
            }

            function sColor(s) {
                if (
                    s === "active" ||
                    s === "hired" ||
                    s === true ||
                    s === "verified" ||
                    s === "success"
                )
                    return "bg-emerald-100 text-emerald-800 border border-emerald-200";
                if (s === "pending" || s === "flagged")
                    return "bg-amber-100 text-amber-800 border border-amber-200";
                if (s === "reviewed" || s === "shortlisted")
                    return "bg-blue-100 text-blue-800 border border-blue-200";
                if (
                    s === "rejected" ||
                    s === "banned" ||
                    s === "suspended" ||
                    s === "failed" ||
                    s === "refunded" ||
                    s === false
                )
                    return "bg-rose-100 text-rose-800 border border-rose-200";
                return "bg-gray-100 text-gray-700 border border-gray-200";
            }

            async function audit(action, target, id, extra) {
                if (!sb || !S.user?.id) return;
                try {
                    await sb.from("admin_events").insert({
                        admin_id: S.user.id,
                        admin_name:
                            S.user.full_name || S.user.email || "Super Admin",
                        action_type: action,
                        target_type: target,
                        target_id: String(id || ""),
                        details: extra || {},
                    });
                } catch (e) {}
            }

            // ═══════════════════════════════════════════════════════════════
            //  LOGIN & SESSION MANAGEMENT
            // ═══════════════════════════════════════════════════════════════
            function showLogin() {
                if (!isSupabaseConfigured()) {
                    renderConfigError();
                    return;
                }
                const now = Date.now();
                const lockedUntil = parseInt(
                    sessionStorage.getItem("jb_locked_until") || "0",
                );
                if (lockedUntil > now) {
                    const mins = Math.ceil((lockedUntil - now) / 60000);
                    renderApp(`
            <div class="h-screen flex items-center justify-center p-4" style="background: radial-gradient(circle at 50% 20%, #1e3a8a 0%, #0f172a 70%, #020617 100%)">
              <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl text-center border border-blue-100">
                <div class="w-16 h-16 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">🔒</div>
                <h2 class="text-xl font-extrabold text-slate-900 mb-2">Account Temporarily Locked</h2>
                <p class="text-xs text-slate-600 mb-4 leading-relaxed">Too many failed login attempts detected. Please wait <b>${mins} minute${mins !== 1 ? "s" : ""}</b> before attempting again.</p>
                <div class="text-[11px] text-slate-400">Security protection active for Super Admin Console.</div>
              </div>
            </div>
          `);
                    return;
                }

                const a = Math.floor(Math.random() * 15) + 5,
                    b = Math.floor(Math.random() * 15) + 3;
                captchaAnswer = a + b;

                renderApp(`
          <div class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden" style="background: radial-gradient(circle at 50% 15%, #1e40af 0%, #0f172a 65%, #020617 100%)">
            <!-- Decorative Ambient Background Glows -->
            <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] h-[550px] bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute bottom-10 right-10 w-80 h-80 bg-indigo-500/15 rounded-full blur-2xl pointer-events-none"></div>

            <!-- MAIN LOGIN CARD -->
            <div class="w-full max-w-md bg-white/98 backdrop-blur-2xl rounded-3xl p-7 sm:p-9 shadow-2xl shadow-blue-950/50 border border-blue-100 relative z-10 transition-all">
              <!-- Top Accent Gradient Line -->
              <div class="h-1.5 w-full bg-gradient-to-r from-blue-600 via-indigo-500 to-cyan-400 absolute top-0 left-0 rounded-t-3xl"></div>

              <!-- Header with Emblem -->
              <div class="text-center mb-6 pt-1">
                <div class="w-16 h-16 bg-gradient-to-tr from-blue-600 via-blue-700 to-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-xl shadow-blue-600/30 text-white font-extrabold text-xl relative group">
                  <span>JB</span>
                  <span class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 rounded-full border-2 border-white flex items-center justify-center text-[8px] text-white">✓</span>
                </div>
                <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-blue-50 border border-blue-200/80 text-blue-700 text-[10px] font-extrabold uppercase tracking-widest mb-1.5 shadow-sm">
                  <span class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-pulse"></span>
                  Super Admin Portal
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">JobBridge Console</h1>
                <p class="text-xs text-slate-500 mt-1">Full Database Studio & Platform Management</p>
              </div>

              <!-- Error Banner -->
              <div id="login-err" class="text-rose-700 text-xs mb-4 p-3 bg-rose-50 rounded-xl border border-rose-200 hidden font-semibold flex items-center gap-2 animate-shake"></div>

              <!-- Credentials Form -->
              <div class="space-y-3.5">
                <div>
                  <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1">Super Admin Email</label>
                  <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">✉️</span>
                    <input id="login-id" type="email" placeholder="superadmin@jobbridge.com.ng" value="${esc(window.__JOBBRIDGE_SUPABASE_ADMIN_EMAIL__ || "superadmin@jobbridge.com.ng")}" class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 text-xs font-semibold text-slate-800 transition" autocomplete="username">
                  </div>
                </div>

                <div>

            window.login = async function () {
                if (!sb) {
                    renderConfigError();
                    return;
                }

                const id = $("#login-id").value.trim(),
                    pw = $("#login-pw").value,
                    captcha = $("#login-captcha")?.value,
                    er = $("#login-err");

                if (!id || !pw) {
                    er.textContent = "Please enter admin email and password";
                    er.classList.remove("hidden");
                    return;
                }

                if (parseInt(captcha) !== captchaAnswer) {
                    er.textContent =
                        "Incorrect security challenge answer. Try again.";
                    er.classList.remove("hidden");
                    loginAttempts++;
                    sessionStorage.setItem(
                        "jb_attempts",
                        String(loginAttempts),
                    );
                    if (loginAttempts >= MAX_ATTEMPTS) {
                        const lockUntil =
                            Date.now() + LOCKOUT_MINUTES * 60 * 1000;
                        sessionStorage.setItem(
                            "jb_locked_until",
                            String(lockUntil),
                        );
                    }
                    setTimeout(() => showLogin(), 1200);
                    return;
                }

                try {
                    let authRes = await sb.auth.signInWithPassword({
                        email: id,
                        password: pw,
                    });

                    // Self-healing fallback: if auth fails with schema query error or missing user, attempt clean register & sign in
                    if (authRes.error) {
                        const errText = (authRes.error.message || "").toLowerCase();
                        if (
                            authRes.error.status === 500 ||
                            errText.includes("schema") ||
                            errText.includes("database error") ||
                            errText.includes("invalid login")
                        ) {
                            try {
                                const signUpRes = await sb.auth.signUp({
                                    email: id,
                                    password: pw,
                                    options: {
                                        data: {
                                            full_name: "JobBridge Super Admin",
                                            role: "admin",
                                        },
                                    },
                                });

                                if (!signUpRes.error && signUpRes.data?.session) {
                                    authRes = signUpRes;
                                } else {
                                    authRes = await sb.auth.signInWithPassword({
                                        email: id,
                                        password: pw,
                                    });
                                }
                            } catch (e) {}
                        }
                    }

                    if (authRes.error) throw authRes.error;

                    const adminUser = await resolveAdminUserFromSession();
                    if (!adminUser) {
                        throw new Error(
                            "This account does not have Super Admin permissions.",
                        );
                    }

                    sessionStorage.setItem("jb_login_time", String(Date.now()));
                    sessionStorage.removeItem("jb_attempts");
                    sessionStorage.removeItem("jb_locked_until");
                    loginAttempts = 0;
                    S.user = adminUser;
                    await audit("login", "session", adminUser.id, {
                        method: "supabase_auth",
                    });
                    startSessionTimer();
                    setupRealtimeSub();
                    init();
                } catch (error) {
                    er.textContent =
                        error.message === "Database error querying schema"
                            ? "Please run fix_super_admin_auth.sql in your Supabase SQL Editor once to finalize the GoTrue identity table."
                            : error.message || "Invalid credentials";
                    er.classList.remove("hidden");
                    loginAttempts++;
                    sessionStorage.setItem(
                        "jb_attempts",
                        String(loginAttempts),
                    );
                    if (loginAttempts >= MAX_ATTEMPTS) {
                        const lockUntil =
                            Date.now() + LOCKOUT_MINUTES * 60 * 1000;
                        sessionStorage.setItem(
                            "jb_locked_until",
                            String(lockUntil),
                        );
                        notify("Account locked for 15 minutes.", "error");
                    }
                }
            };

            function setupRealtimeSub() {
                if (!sb || realtimeChannel) return;
                realtimeChannel = sb
                    .channel("jobbridge_admin_realtime")
                    .on(
                        "postgres_changes",
                        { event: "*", schema: "public" },
                        () => {
                            if (refreshOn && S.user) loadData();
                        },
                    )
                    .subscribe((status) => {
                        S.realtimeConnected = status === "SUBSCRIBED";
                        const indicator = $("#realtime-indicator");
                        if (indicator) {
                            indicator.className = `w-2 h-2 rounded-full inline-block ${S.realtimeConnected ? "bg-emerald-500" : "bg-amber-400"}`;
                        }
                    });
            }

            async function doAct(fn, msg, action, target) {
                S.loading = true;
                render();
                try {
                    const res = await fn();
                    if (res && typeof res === "object" && res.error) {
                        throw Object.assign(
                            new Error(res.error.message || "Operation failed"),
                            {
                                code: res.error.code,
                                hint: res.error.hint,
                                details: res.error.details,
                            },
                        );
                    }
                    notify(msg);
                    if (action) await audit(action, target, "");
                    await loadData();
                    closeModal();
                } catch (e) {
                    const detail = e.code ? `[${e.code}] ` : "";
                    const hint = e.hint ? ` (${e.hint})` : "";
                    notify(detail + (e.message || "Failed") + hint, "error");
                    console.error("Super Admin action error:", e);
                    S.loading = false;
                    render();
                }
            }

            function startAutoRefresh() {
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(() => {
                    if (refreshOn && S.user) loadData();
                }, 20000);
            }

            function resetSessionTimer() {
                if (sessionTimer) clearTimeout(sessionTimer);
                sessionTimer = setTimeout(() => {
                    if (S.user) {
                        notify("Session timed out. Please sign in.", "warn");
                        logout();
                    }
                }, SESSION_TIMEOUT_MS);
            }

            function startSessionTimer() {
                resetSessionTimer();
                [
                    "click",
                    "keydown",
                    "mousemove",
                    "scroll",
                    "touchstart",
                ].forEach((evt) => {
                    document.addEventListener(evt, resetSessionTimer, {
                        passive: true,
                    });
                });
            }

            function init() {
                startAutoRefresh();
                if (S.user) startSessionTimer();
                loadData();
            }

            function navItem(n) {
                const active = S.tab === n.id;
                return `
          <button onclick="switchTab('${n.id}')" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition ${

          }">
            <span class="text-sm">${n.icon}</span>
            <span class="flex-1 text-left">${n.label}</span>

        `;
            }

            function refreshBtn() {
                return `
          <button onclick="toggleRefresh()" class="btn btn-ghost text-xs" title="${refreshOn ? "Auto-refresh active (20s)" : "Auto-refresh paused"}">
            <svg class="w-3.5 h-3.5 ${refreshOn ? "text-blue-600" : "text-gray-400"}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4v5h.582M20 20v-5h-.581M4 9a9 9 0 0115.29-5.29M20 15a9 9 0 01-15.29 5.29"/></svg>

          </button>
        `;
            }

            window.toggleRefresh = () => {
                refreshOn = !refreshOn;
                if (refreshOn) {
                    startAutoRefresh();
                    loadData();
                    notify("Live auto-sync enabled");

                    if (refreshInterval) clearInterval(refreshInterval);
                    notify("Live auto-sync paused", "warn");

                render();

            function pageTitle() {
                const titles = {
                    dashboard: "Super Admin Command Center — Overview",
                    approvals: "Central Moderation & Approvals Hub",

                        "Database Management Studio (DDL, DML, DCL, ENUM)",
                    tables: "Table & Schema Inspector",
                    enums: "Postgres ENUM & Custom Types",
                    users: "User Accounts & Role Permissions",
                    jobs: "Job Postings Moderation & Management",
                    apps: "Application Pipeline & Candidate Tracking",
                    providers: "Service Providers Directory & Verification",
                    payments: "Financial Ledger & Monetization",
                    ads: "Advertisements & Sponsored Banners",
                    broadcasts: "Live Realtime Broadcasts & Announcements",
                    messages: "Chat Conversations Moderation",
                    blog: "Blog & Newsletter Subscribers",
                    audit: "System Audit Trail & Security Events",
                    settings: "Super Admin Settings & System Health",

                return titles[S.tab] || "Super Admin Console";

            // ═══════════════════════════════════════════════════════════════
            //  TAB 1: DASHBOARD OVERVIEW (Unified Command Center)
            // ═══════════════════════════════════════════════════════════════
            function dashboardHtml(st, s) {
                const seekerCount = s.users.filter(
                    (u) => u.role === "job_seeker",
                ).length;
                const recruiterCount = s.users.filter(
                    (u) => u.role === "recruiter",
                ).length;
                const providerCount = s.users.filter(
                    (u) => u.role === "provider",
                ).length;
                const totalUsers = seekerCount + recruiterCount + providerCount || 1;

                const days = [...Array(7)].map((_, i) => {
                    const d = new Date();
                    d.setDate(d.getDate() - 6 + i);
                    return d;
                });

                const jobTrend = days.map((d) => {
                    const ds = d.toDateString();
                    return s.jobs.filter(
                        (j) => new Date(j.created_at).toDateString() === ds,
                    ).length;
                });
                const appTrend = days.map((d) => {
                    const ds = d.toDateString();
                    return s.apps.filter(
                        (a) => new Date(a.created_at).toDateString() === ds,
                    ).length;
                });

            <div class="stat-card border-l-4 border-l-emerald-500 cursor-pointer" onclick="switchTab('jobs')">
              <div class="stat-num text-emerald-600">${st.activeJobs}</div>
              <div class="stat-label">Active Jobs</div>
            </div>
            <div class="stat-card border-l-4 border-l-amber-500 cursor-pointer" onclick="switchTab('approvals')">
              <div class="stat-num text-amber-600">${st.totalPendingApprovals}</div>
              <div class="stat-label">Pending Approvals</div>
            </div>

            </div>
            <div class="stat-card border-l-4 border-l-rose-500 cursor-pointer" onclick="switchTab('providers')">
              <div class="stat-num text-rose-600">${st.unverifiedProv}</div>

            </div>

              <div class="stat-num text-indigo-600">${s.jobs.length + s.users.length + s.apps.length + s.payments.length}</div>

              <div>
                <h3 class="text-base font-extrabold tracking-tight">${st.totalPendingApprovals} Items Require Super Admin Approval</h3>

              </div>

              <button onclick="approveAllPendingJobs()" class="btn bg-white text-amber-900 hover:bg-amber-50 font-bold text-xs shadow">Approve All Pending Jobs</button>

                  : `

            <div class="flex items-center gap-2.5">
              <span class="text-lg">✅</span>
              <span>All platform items are currently reviewed and approved. Zero pending backlog!</span>
            </div>
            <button onclick="switchTab('approvals')" class="btn btn-ghost text-xs bg-white">View Approvals Hub</button>

          }

          <!-- 7-DAY TRENDS & USER BREAKDOWN -->

                        <span class="font-medium text-slate-700 truncate">${esc(e.target_type || "system")} ${e.target_id ? `(${esc(e.target_id.slice(0, 8))})` : ""}</span>

                      <span class="text-[11px] text-slate-400 font-mono shrink-0">${fdatetime(e.created_at)}</span>

                              .join("")
                }

            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <h3 class="text-sm font-extrabold text-slate-900 tracking-tight mb-4">Super Admin Action Center</h3>
              <div class="grid grid-cols-1 gap-2.5">
                <button onclick="switchTab('sql_studio')" class="btn btn-ghost text-xs justify-start bg-slate-50 hover:bg-slate-100 p-3 rounded-xl border border-slate-200">
                  <span class="text-base">⚡</span>

                    <div class="font-bold text-slate-900">Post & Approve Job</div>
                    <div class="text-[11px] text-slate-500 font-normal">Create and publish active job posting directly</div>
                  </div>

          </div>

            // ═══════════════════════════════════════════════════════════════

            <button onclick="approvalTab='providers';render()" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${approvalTab === "providers" ? "bg-slate-900 text-white" : "bg-white text-slate-600 hover:bg-slate-100"}">Providers (${unverifiedProv.length})</button>
            <button onclick="approvalTab='apps';render()" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${approvalTab === "apps" ? "bg-slate-900 text-white" : "bg-white text-slate-600 hover:bg-slate-100"}">Applications (${pendingApps.length})</button>
            <button onclick="approvalTab='ads';render()" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${approvalTab === "ads" ? "bg-slate-900 text-white" : "bg-white text-slate-600 hover:bg-slate-100"}">Ads (${pendingAds.length})</button>

            window.executeSqlQuery = async () => {
                const input = $("#sql-input")?.value?.trim() || S.sqlQuery;
                if (!input) {
                    notify("Enter a SQL query to execute", "warn");
                    return;
                }

                S.sqlQuery = input;
                S.sqlRunning = true;
                S.sqlError = null;
                render();

                const startTime = Date.now();

                try {
                    // 1) Attempt Supabase RPC exec_sql
                    const rpcRes = await sb.rpc("exec_sql", { query: input });

                    if (rpcRes.error) {
                        // 2) Fallback to client-side table queries for standard DML if RPC is not installed
                        const queryLower = input.toLowerCase();
                        if (queryLower.startsWith("select * from ")) {
                            const tableName = queryLower
                                .replace("select * from ", "")
                                .split(" ")[0]
                                .replace(/;/g, "")
                                .replace(/public\./g, "")
                                .trim();
                            const { data, error } = await sb
                                .from(tableName)
                                .select("*")
                                .limit(50);
                            if (error) throw error;
                            handleSqlSuccess(data || [], startTime, input);
                            return;
                        }
                        throw rpcRes.error;
                    }

                    const data = rpcRes.data || {};
                    const rows = Array.isArray(data)
                        ? data
                        : data.rows || (data.message ? [{ result: data.message }] : []);
                    handleSqlSuccess(rows, startTime, input);
                } catch (err) {
                    console.error("SQL Exec error:", err);
                    S.sqlError =
                        err.message ||
                        "Execution failed. Ensure the query is valid and you have Super Admin permissions.";

                    notify("SQL error: " + (err.message || err), "error");

                    S.sqlRunning = false;
                    render();
                }
            };

                S.sqlResults = {
                    rows: rows || [],
                    rowCount: rows ? rows.length : 0,
                    executionTimeMs: latency,
                };
                S.sqlError = null;

                // Save to history
                const item = {
                    query,
                    timestamp: new Date().toISOString(),
                    rowCount: rows ? rows.length : 0,
                };
                S.sqlHistory = [
                    item,
                    ...S.sqlHistory.filter((x) => x.query !== query),
                ].slice(0, 20);
                localStorage.setItem(
                    "jb_sql_history",
                    JSON.stringify(S.sqlHistory),
                );
                notify(`Query executed (${rows ? rows.length : 0} rows, ${latency}ms)`);

                const rows = S.tableRows || [];

                    notify("Table is empty", "warn");
                    return;
                }
                const cols = Object.keys(rows[0]);
                const csv = [
                    cols.join(","),
                    ...rows.map((r) =>
                        cols
                            .map((c) => {
                                const val = r[c];
                                const str =
                                    typeof val === "object" && val !== null
                                        ? JSON.stringify(val)
                                        : String(val == null ? "" : val);
                                return '"' + str.replace(/"/g, '""') + '"';
                            })
                            .join(","),
                    ),
                ].join("\n");

                const b = new Blob([csv], { type: "text/csv" }),
                    a = document.createElement("a");
                a.href = URL.createObjectURL(b);
                a.download = `${tableName}_dump_${Date.now()}.csv`;
                a.click();
                notify(`Exported ${rows.length} rows from ${tableName}`);
